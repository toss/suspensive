packages:
  - configs/*
  - docs/*
  - examples/*
  - packages/*

catalog:
  next: ^16.2.6
  '@next/third-parties': ^16.2.6
  sharp: ^0.34.5
  '@tailwindcss/postcss': ^4.3.0
  tailwindcss: ^4.3.0
  clsx: ^2.1.1
  zod: ^4.4.3
  react-error-boundary: ^6.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/coverage-istanbul': 5.0.5
  '@vitest/ui': 5.0.5

catalogs:
  react18:
    react: 18.3.1
    '@types/react': 18.3.12
    react-dom: 18.3.1
    '@types/react-dom': 18.3.1
  react19:
    react: ^19.2.6
    '@types/react': ^19.2.14
    react-dom: ^19.2.6
    '@types/react-dom': ^19.2.3
  react-query4:
    '@tanstack/react-query': 4.44.0
  react-query5:
    '@tanstack/react-query': ^5.100.10
    '@tanstack/react-query-devtools': ^5.100.10

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - es5-ext
  - esbuild
  - msw
  - sharp

packageExtensions:
  # codehike imports zod in its types without declaring it; resolve it from the consumer instead of hoisting
  codehike:
    peerDependencies:
      zod: '*'

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
